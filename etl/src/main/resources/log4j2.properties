# Logging for `run`, which had none at all.
#
# Without this Spark falls back to its packaged profile, which logs at INFO: about
# eighty lines of driver, block manager and Jetty startup before the program's own
# first line of output. Worse, sbt paints everything a forked JVM writes to stderr
# with an `[error]` prefix, so a run that worked perfectly looked like a wall of
# failures — which is exactly what it was mistaken for.
#
# Two things fix that. The level goes to warn, and the appender targets SYSTEM_OUT
# rather than stderr, so what does get printed arrives as output instead of as an
# apparent error.
#
# The test configuration in `shared/test/resources` is deliberately separate and
# does more: the specs provoke failures on purpose and have to silence the loggers
# that report them. A run provokes nothing, so it needs none of that.

rootLogger.level = warn
rootLogger.appenderRef.stdout.ref = stdout

appender.stdout.type = Console
appender.stdout.name = stdout
appender.stdout.target = SYSTEM_OUT
appender.stdout.layout.type = PatternLayout
appender.stdout.layout.pattern = %d{HH:mm:ss} %p %c{1}: %m%n

# Hadoop without its native libraries, which is every run of this project and
# every run of most projects. Nothing to act on.
logger.nativecode.name = org.apache.hadoop.util.NativeCodeLoader
logger.nativecode.level = error
