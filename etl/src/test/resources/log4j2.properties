# Test logging, kept quiet on purpose.
#
# Several specs assert that something fails: an invalid cast under ANSI, a typed
# lambda that Sail cannot run, a frame missing a column. ScalaTest catches those
# and the tests are green — but Spark logs each one on its way out, so a passing
# run used to print stack traces that look exactly like a broken build.
#
# Only the loggers that report those are turned down, and only to the level that
# hides an expected throw. A test that genuinely fails is still reported by
# ScalaTest itself, which does not go through log4j at all.

rootLogger.level = warn
rootLogger.appenderRef.stdout.ref = stdout

appender.stdout.type = Console
appender.stdout.name = stdout
appender.stdout.target = SYSTEM_OUT
appender.stdout.layout.type = PatternLayout
appender.stdout.layout.pattern = %d{HH:mm:ss} %p %c{1}: %m%n

# Task-level reporting of an exception the test asked for.
logger.executor.name = org.apache.spark.executor.Executor
logger.executor.level = off
logger.tasksetmanager.name = org.apache.spark.scheduler.TaskSetManager
logger.tasksetmanager.level = off

# The Connect client's own commentary on the same expected failures, plus the
# teardown race it reports when a session closes while a release is in flight.
logger.grpcconverter.name = org.apache.spark.sql.connect.client.GrpcExceptionConverter
logger.grpcconverter.level = off
logger.reattach.name = org.apache.spark.sql.connect.client.ExecutePlanResponseReattachableIterator
logger.reattach.level = off

# `BaseCaseSpec` joins two frames with identical schemas on purpose. The Connect
# client cannot tell the two `COL_A`s apart before the server resolves them and
# warns that the predicate looks trivially true. It is not — that spec joins two
# keys a side precisely so a degenerate condition would fail it.
logger.column.name = org.apache.spark.sql.Column
logger.column.level = error

# Hadoop without its native libraries, which is every run of this project and
# every run of most projects. Nothing to act on.
logger.nativecode.name = org.apache.hadoop.util.NativeCodeLoader
logger.nativecode.level = error

# Deliberately NOT silenced: org.apache.spark.sql.execution.datasources.v2.TableOutputResolver
#
# It warns when a query's columns match a table's by name but not by order —
# which is precisely the silent corruption `Conform` exists to prevent. One test
# provokes it on purpose (`ConformSpec`, "so insertInto ... writes the wrong
# values"), so a clean run still prints it once. That is the right trade: muting
# it would also mute the day a real ETL starts inserting in the wrong order.
