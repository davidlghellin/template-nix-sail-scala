# Scala Steward's configuration for this repository.
#
# Spark, Scala, pysail and sail-testkit are deliberately invisible to it: they
# live in versions.json, read by a function in build.sbt and by flake.nix, so no
# bot can see them. That is the point — bumping Spark forces bumping pysail with
# it, because Sail takes its Spark configuration from the client version, and
# that pairing is a decision rather than an update.
#
# Nothing else here depends on Nix. The bot installs its own sbt and JDK, loads
# build.sbt, and needs nothing from the devshell to do it. flake.lock has its own
# bot (update-flake-lock.yml).

# sbt 2 is a migration, not a bump: a new build language and plugins that have
# to catch up. Pinned to the 1.x line so patch releases keep arriving without
# the jump being proposed every Monday.
updates.pin = [
  { groupId = "org.scala-sbt", artifactId = "sbt", version = "1." }
]
