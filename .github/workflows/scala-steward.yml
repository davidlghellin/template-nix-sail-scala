name: scala-steward

# The Scala dependency bot: it reads build.sbt and opens a PR for every new
# version it can see. Spark, Scala, pysail and the test kit are not among them
# — see .scala-steward.conf.
on:
  schedule:
    - cron: "0 6 * * 1" # Monday morning
  workflow_dispatch: # and by hand when needed

jobs:
  scala-steward:
    runs-on: ubuntu-latest
    # The bot pushes a branch and opens a pull request, and the repository
    # default for GITHUB_TOKEN is read-only: without this the run gets all the
    # way to `git push` and dies with a 403. Granted here rather than by
    # loosening the repository-wide default.
    #
    # Opening the pull request needs one more thing that cannot be set from
    # here: Settings -> Actions -> General -> "Allow GitHub Actions to create
    # and approve pull requests".
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: scala-steward-org/scala-steward-action@v2
        with:
          # With the default GITHUB_TOKEN, the PRs the bot opens do NOT trigger
          # workflows, so they would land without CI. With a PAT in the
          # SCALA_STEWARD_TOKEN secret, they do. If it is missing, this falls
          # back to the default token and the bot still works: CI just has to
          # be launched by hand.
          github-token: ${{ secrets.SCALA_STEWARD_TOKEN || secrets.GITHUB_TOKEN }}
          author-email: davidlghellin@gmail.com
          author-name: Scala Steward
