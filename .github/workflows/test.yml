name: test

on:
  push:
    branches: [master, main]
  pull_request:

# A new push to a pull request makes the run in flight pointless, and on an
# iterative branch that is most of them. Cancelling frees the runners for the
# push that supersedes it. Never cancel on `main`: those runs are the record.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Nothing here writes anything back.
permissions:
  contents: read

# The shape is a graph rather than a flat list of jobs, and not for the picture.
# Every job here starts by entering the same devshell and resolving the same
# dependencies, so when they all start at once they all miss the cache at once
# and each downloads Spark — about 300 MB, three times over, in parallel.
#
#   setup ──┬── test (classic)
#           ├── test (connect)
#           ├── format
#           └── commands
#
# `setup` decides and nothing else. It was briefly a warm-up job that resolved
# dependencies so the others would not each repeat it — and measured, that was a
# bad trade: it cost 1m 19s that everything downstream waited for, to save a
# download that only happens on a cold cache. Warm is the common case, so the
# common case was paying for the rare one. It now runs in seconds.
#
# `actions/cache` carries the sbt and coursier downloads. There is deliberately
# no Nix binary cache here, and the reason is measured rather than assumed:
# `magic-nix-cache-action` was tried and removed. It did work — the store paths
# arrived from a local daemon instead of cache.nixos.org — but it took the
# `format` job's `nix develop` from 1m 0s to 56s while costing 13s of its own.
# The bottleneck is not where the closure comes from, it is `nix` copying
# thousands of paths into an empty store, which costs the same either way. The
# lever that would actually move it is a smaller closure.
#
# What is deliberately *not* shared is compiled output. Passing `target/` between
# jobs would save a compile, but sbt's incremental state does not travel well
# between machines and a stale hit is worse than a cold build. The tests compile
# their own.

jobs:
  setup:
    name: setup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      # Whether anything that could change a test result was touched. A pull
      # request that only edits prose does not need two Spark suites run
      # against it, and used to get them anyway.
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - '**/*.scala'
              - 'build.sbt'
              - 'project/**'
              - 'versions.json'
              - 'flake.nix'
              - 'flake.lock'
              - '.scalafmt.conf'
              - 'scripts/**'
              # The data the specs read, and the logging config that decides whether
              # a green run is quiet. Neither is a .scala file, and leaving them out
              # meant a changed fixture skipped the suites that read it.
              - 'resources/**'
              - '**/src/*/resources/**'
              - '.github/workflows/**'

  test:
    name: test (${{ matrix.backend }})
    needs: setup
    if: ${{ needs.setup.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The same tests against both engines: classic Spark on the JVM and
        # Sail over Spark Connect. That the two agree is the whole point of this
        # template, so neither may be left unrun.
        #
        # One compilation, two runs: the backend is a run-time choice now, so
        # this is `SPARK_BACKEND` rather than two sbt projects.
        backend: [classic, connect]
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/coursier
            ~/.sbt
          key: sbt-${{ runner.os }}-${{ hashFiles('build.sbt', 'versions.json', 'project/build.properties') }}
          restore-keys: sbt-${{ runner.os }}-
      - uses: actions/cache@v6
        with:
          path: .venv-sail
          key: sail-${{ runner.os }}-${{ hashFiles('versions.json') }}
      - run: nix develop --command sbt -batch test
        env:
          SPARK_BACKEND: ${{ matrix.backend }}

  format:
    name: format
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      # Its own job because it takes seconds and needs no dependencies at all.
      # Bundled with the slower checks, a misplaced brace used to be reported
      # only after a full compile had finished.
      - run: nix develop --command scalafmt --test .

  commands:
    name: commands
    needs: setup
    if: ${{ needs.setup.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/coursier
            ~/.sbt
          key: sbt-${{ runner.os }}-${{ hashFiles('build.sbt', 'versions.json', 'project/build.properties') }}
          restore-keys: sbt-${{ runner.os }}-
      # Three devshell commands were broken and advertised for weeks: `run-demo`
      # died on the root project, `cscala` opened a REPL with no Spark, and
      # `clean-all` deleted three of five target directories. Nothing caught it
      # because nothing ran them. This does.
      - run: nix develop --command check-commands
