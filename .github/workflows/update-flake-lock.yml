name: update-flake-lock

# Neither Dependabot nor Scala Steward looks at flake.lock, so the Nix inputs
# (nixpkgs, devshell) would stay frozen forever. This opens a PR running
# `nix flake update`.
on:
  schedule:
    - cron: "0 6 1 * *" # the 1st of every month
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    # Pinned to commit SHAs, not tags: this job holds a write token, and a tag
    # can be moved. Dependabot still bumps them and keeps the version comment.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: DeterminateSystems/update-flake-lock@834c491b2ece4de0bbd00d85214bb5e83b4da5c6 # v28
        with:
          pr-title: "chore(nix): update flake.lock"
          pr-labels: dependencies
